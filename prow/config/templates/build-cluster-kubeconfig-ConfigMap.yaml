# Kubeconfig mounted into the four components that reach the build cluster
# (prow-controller-manager, sinker, crier, deck). Prow loads each context as an
# additional build cluster; the context name here MUST equal buildCluster.name
# and the `cluster:` field set on routed jobs.
#
# The `build` context authenticates with an exec credential — aws-iam-authenticator
# ships in the upstream component base images, so no wrapper image is needed.
# Only the bearer token is minted per-request by the exec plugin; the API server
# endpoint and cluster CA are stored here (EKS API certs are signed by the
# cluster's own CA, not a public one) and are populated via Flux substitution
# (BUILD_CLUSTER_ENDPOINT / BUILD_CLUSTER_CA), sourced from the build cluster's
# ACK Cluster CR status by flux/prow/build-cluster-connection.
#
# Phase 1 (same account): exec runs `aws-iam-authenticator token -i <clusterName>`
# with NO role assumption — the component's own Pod Identity (prow-deployment-role)
# is the caller, and its AccessEntry on the build cluster authorizes it.
# Phase 2 (separate account): buildCluster.accessRoleArn is set, adding `-r <arn>`
# so the caller assumes the build-account access role before minting the token.
{{- if .Values.buildCluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-cluster-kubeconfig
data:
  config: |
    apiVersion: v1
    kind: Config
    current-context: default
    clusters:
    - name: {{ .Values.buildCluster.name }}
      cluster:
        server: {{ required "buildCluster.server is required when buildCluster.enabled" .Values.buildCluster.server }}
        certificate-authority-data: {{ required "buildCluster.certificateAuthorityData is required when buildCluster.enabled" .Values.buildCluster.certificateAuthorityData }}
    contexts:
    - name: {{ .Values.buildCluster.name }}
      context:
        cluster: {{ .Values.buildCluster.name }}
        user: {{ .Values.buildCluster.name }}
    users:
    - name: {{ .Values.buildCluster.name }}
      user:
        exec:
          apiVersion: client.authentication.k8s.io/v1beta1
          command: aws-iam-authenticator
          args:
          - token
          - -i
          - {{ required "buildCluster.clusterName is required when buildCluster.enabled" .Values.buildCluster.clusterName }}
          {{- if .Values.buildCluster.accessRoleArn }}
          - -r
          - {{ .Values.buildCluster.accessRoleArn }}
          {{- end }}
{{- end }}
