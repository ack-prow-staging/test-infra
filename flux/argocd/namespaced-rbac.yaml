# RBAC that lets Argo CD apply the Role and RoleBinding objects in the charts it manages. Bound to
# the kubernetesGroup on the capability role's EKS access entry, which Terraform sets
# (bootstrap/argocd-access.tf).
#
# WHY THIS EXISTS, and why it is not a privilege increase.
#
# Kubernetes escalation prevention: a principal may not create a Role granting permissions it does
# not itself hold. The check lives inside the RBAC authorizer and resolves IN-CLUSTER RBAC only, so
# a principal authorised entirely by EKS access policies holds nothing as far as it is concerned and
# cannot create a Role granting anything at all. Argo CD hit this on every path carrying RBAC:
#
#   roles.rbac.authorization.k8s.io "build-cluster-connection-write" is forbidden:
#   user ".../ack-test-infra-staging-argocd-capability-role/aws-go-sdk-..."
#   (groups=["argocd-cluster-scoped" "system:authenticated"]) is attempting to grant
#   RBAC permissions not currently held: {APIGroups:[""], Resources:["configmaps"], ...}
#
# So these rules add no access Argo CD lacked. They restate what the associated access policies
# already grant, in the form the RBAC authorizer can see.
#
# HOW IT IS SHAPED, and why it stopped being a list of individual rules.
#
# The first four paths were unblocked one rule at a time, each discovered by a failed sync. That
# does not converge: every chart that adds a Role adds another round trip. Measured across the
# remaining paths, 13 more triples were missing over two namespaces - and 12 of the 13 fall inside
# the built-in aggregated `admin` ClusterRole.
#
# AmazonEKSAdminPolicy is already associated to this principal scoped to exactly
# {flux-system, prow, test-pods, ack-system}. So a RoleBinding to `admin` in those namespaces grants
# NO NEW EFFECTIVE PRIVILEGE - it mirrors the access policy the EKS authorizer already honours, into
# the authorizer that escalation prevention consults. One binding per namespace replaces the
# open-ended list, and any future namespaced Role in those namespaces just works.
#
# WHAT IS DELIBERATELY NOT DONE: binding cluster-admin. That would be a genuine expansion - Argo CD
# holds no cluster-wide write on workloads today and only read on pods - it is what the header of
# cluster-scoped-rbac.yaml records as refused, and it lands in prod when this merges. The
# whack-a-mole it would save is now small: after this change only cluster-scoped grants and custom
# resource types need explicit rules, and both are rare enough that explicitness is worth more than
# brevity there.
#
# WHAT STILL NEEDS EXPLICIT RULES:
#   - custom resources, which `admin` does not aggregate: eks.services.k8s.aws/clusters,
#     secrets-store.csi.x-k8s.io/secretproviderclasses, prow.k8s.io/prowjobs
#   - the argocd namespace, which no access policy covers (AmazonEKSAdminPolicy excludes it and
#     AmazonEKSArgoCDPolicy is the capability's own-operation grant), so it gets neither an admin
#     binding nor free roles/rolebindings write
#
# Reconciled by Flux, like cluster-scoped-rbac.yaml, for the same reason: Argo CD cannot apply the
# object that authorises Argo CD. Phase 5 has to decide who owns both.
---
# Namespaces where AmazonEKSAdminPolicy is already associated. The binding is the access policy,
# restated where escalation prevention can see it.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-namespace-admin
  namespace: ack-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
# The group Terraform adds to the capability role's access entry. The entry's username is
# session-templated and cannot serve as an RBAC subject, so a group is the only stable option -
# see bootstrap/argocd-access.tf.
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-namespace-admin
  namespace: prow
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-namespace-admin
  namespace: test-pods
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-namespace-admin
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
# Custom resources, which the aggregated `admin` ClusterRole does not cover. One Role per namespace,
# holding only CR types.
#
# ack-system: the connection Job's chart reads the build-cluster Cluster CR status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rbac-grantor
  namespace: ack-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
rules:
- apiGroups: ["eks.services.k8s.aws"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rbac-grantor
  namespace: ack-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rbac-grantor
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
# prow: the secrets path declares a SecretProviderClass here, and prow-config's Roles grant
# prowjobs including `delete`, which the cluster-scoped rule deliberately omits - sinker deletes
# ProwJobs, so the permission is real, but it is granted here rather than cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rbac-grantor
  namespace: prow
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
rules:
- apiGroups: ["secrets-store.csi.x-k8s.io"]
  resources: ["secretproviderclasses"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["prow.k8s.io"]
  resources: ["prowjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rbac-grantor
  namespace: prow
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rbac-grantor
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
# test-pods: the second SecretProviderClass. Job pods mount it via the CSI driver.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rbac-grantor
  namespace: test-pods
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
rules:
- apiGroups: ["secrets-store.csi.x-k8s.io"]
  resources: ["secretproviderclasses"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rbac-grantor
  namespace: test-pods
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rbac-grantor
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
---
# argocd: the one namespace no access policy covers, so nothing here comes for free.
#
# AmazonEKSAdminPolicy is scoped to {ack-system, prow, test-pods, flux-system} and excludes this
# namespace; AmazonEKSArgoCDPolicy covers it but is the capability's own-operation grant, which reads
# cluster registration Secrets rather than managing RBAC. So this namespace gets no admin binding and
# needs both halves spelled out:
#
#   1. the ability to create roles and rolebindings at all. Elsewhere the admin binding provides it.
#      Without it the failure is a plain "cannot create resource roles in API group
#      rbac.authorization.k8s.io in the namespace argocd" - not an escalation error, and easy to
#      mistake for one.
#   2. holding whatever the created Role grants, so escalation prevention passes: the secrets,
#      appprojects and applications rules below, matching build-cluster-connection-registrar.
#
# Granting roles/rolebindings write here does not let Argo CD widen its own access: escalation
# prevention still caps any Role it creates at the permissions it already holds. `escalate` was the
# other option and is worse - it would let Argo CD create a Role conferring anything at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rbac-grantor
  namespace: argocd
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
# The connection Job appends the build cluster to the AppProject's destinations, and applies the
# prow-build-cluster-resources Application. Both are runtime work because they name a cluster ACK
# owns and Terraform must hold nothing keyed to it (D13). appprojects is get and patch only - the
# AppProject is Terraform-owned and the Job amends one field - while applications needs create,
# because the Job owns that object outright. No delete on either.
- apiGroups: ["argoproj.io"]
  resources: ["appprojects"]
  verbs: ["get", "patch"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rbac-grantor
  namespace: argocd
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rbac-grantor
subjects:
- kind: Group
  name: argocd-cluster-scoped
  apiGroup: rbac.authorization.k8s.io
