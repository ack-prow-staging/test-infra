# Surfaces the build cluster's connection details (API server endpoint + cluster
# CA) into the build-cluster-connection ConfigMap in flux-system.
#
# Why a Job (not a static ConfigMap): the build cluster is created by ACK, not
# Terraform, so its endpoint/CA are not available to self-managed-vars at
# bootstrap. They live in the build-cluster Cluster CR's status, which ACK keeps
# synced. Reading from the CR (rather than hardcoding) means a cluster
# re-creation — the only event that changes these values — is picked up
# automatically on the next reconcile.
#
# prow-charts substitutes BUILD_CLUSTER_ENDPOINT / BUILD_CLUSTER_CA from the
# ConfigMap this Job writes into the four components' build-cluster kubeconfig.
# Runs each reconcile (Flux force-replaces the immutable Job) so the ConfigMap
# tracks the CR.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-cluster-connection
  namespace: flux-system
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: build-cluster-connection
      restartPolicy: Never
      containers:
      - name: surface-connection
        image: "${PROW_IMAGES_REPO_URI}:prow-kubectl-0.0.2"
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          CR_NS="ack-system"
          CR="build-cluster"

          echo "Reading connection details from Cluster CR $${CR_NS}/$${CR}..."
          EP=$$(kubectl -n "$$CR_NS" get cluster.eks.services.k8s.aws "$$CR" \
                 -o jsonpath='{.status.endpoint}')
          CA=$$(kubectl -n "$$CR_NS" get cluster.eks.services.k8s.aws "$$CR" \
                 -o jsonpath='{.status.certificateAuthority.data}')

          if [ -z "$$EP" ] || [ -z "$$CA" ]; then
            echo "ERROR: endpoint or CA empty — is the build-cluster CR synced?" >&2
            exit 1
          fi

          echo "  endpoint: $$EP"
          echo "  ca: $${CA:0:40}...(truncated)"

          kubectl create configmap build-cluster-connection -n flux-system \
            --from-literal=BUILD_CLUSTER_ENDPOINT="$$EP" \
            --from-literal=BUILD_CLUSTER_CA="$$CA" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "build-cluster-connection ConfigMap updated."
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
