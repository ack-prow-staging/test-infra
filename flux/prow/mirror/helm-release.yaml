# Renders flux/prow/charts/prow-mirror instead of the token-substituted manifest.
#
# targetNamespace is test-pods, matching where the Job has always run. The
# template keeps its explicit metadata.namespace, so this only supplies the
# release namespace.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prow-mirror
  namespace: flux-system
spec:
  # NOT cut over, and it should not be an Argo CD Application at all.
  #
  # This path's only object is the mirror Job, which is a Helm post-install/post-upgrade
  # hook. Argo CD classifies hooks with status None and does not include them in the
  # comparison, so the Application has ZERO tracked resources. It is therefore
  # permanently and trivially Synced - there is nothing that can ever differ - which
  # means no drift, no sync, and no hook run. Enabling syncPolicy.automated does not
  # help: automated fires on drift, and drift is impossible here.
  #
  # So this is not a permissions problem or a syncStrategy problem. An Application whose
  # only object is a hook has no trigger, by construction.
  #
  # That matches the original decision (D3), which had prow-mirror leaving the sync path
  # entirely to become a Prow periodic. Converting it to a Helm hook chart moved it the
  # wrong way. The fix is to make the mirror a scheduled job Prow owns, then delete this
  # path and its Application - not to migrate it.
  #
  # Flux keeps running it meanwhile: helm-controller executes the hook on every upgrade.
  #
  # prow-build-cluster-connection is NOT the same case, despite also being hook-driven:
  # it has seven tracked RBAC objects, so syncs do happen there and the hook question is
  # still open for it.
  interval: 60m
  targetNamespace: test-pods
  chart:
    spec:
      chart: ./flux/prow/charts/prow-mirror
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # The Job is a Helm hook with hook-delete-policy: before-hook-creation,
    # which deletes and recreates it. force is not the mechanism and would not
    # work anyway: Helm force is a replace, and the API server still rejects a
    # changed Job spec.template as immutable.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: REGION
    targetPath: region
  - kind: ConfigMap
    name: prow-version
    valuesKey: PROW_VERSION
    targetPath: prowVersion
  - kind: ConfigMap
    name: prow-version
    valuesKey: PROW_PATCH_REVISION
    targetPath: prowPatchRevision
  - kind: ConfigMap
    name: prow-version
    valuesKey: TOOLS_VERSION
    targetPath: toolsVersion
