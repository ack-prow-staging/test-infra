# RBAC for the build-cluster-connection Job (job.yaml).
#
# The Job reads the build cluster's connection details (API server endpoint +
# cluster CA) from the ACK Cluster CR's status and writes them into the
# build-cluster-connection ConfigMap, which prow-charts substitutes into the
# four components' build-cluster kubeconfig (server / certificate-authority-data).
#
# It also assembles the finished build-cluster-kubeconfig ConfigMap in the prow
# namespace, which the four components mount directly. That removes the render-time
# substitution step, which Argo CD cannot perform.
#
# Least privilege: read the one Cluster CR in ack-system, write one ConfigMap in
# flux-system and one in prow. No AWS/IAM credentials needed — the endpoint + CA
# live in the CR status (ACK keeps them synced), so this is pure in-cluster RBAC.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-cluster-connection
  namespace: flux-system
---
# Read the build-cluster Cluster CR's status (endpoint + certificateAuthority).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-cluster-connection-read
  namespace: ack-system
rules:
- apiGroups: ["eks.services.k8s.aws"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-cluster-connection-read
  namespace: ack-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-cluster-connection-read
subjects:
- kind: ServiceAccount
  name: build-cluster-connection
  namespace: flux-system
---
# Write the build-cluster-connection ConfigMap in flux-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-cluster-connection-write
  namespace: flux-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-cluster-connection-write
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-cluster-connection-write
subjects:
- kind: ServiceAccount
  name: build-cluster-connection
  namespace: flux-system
---
# Write the assembled kubeconfig ConfigMap that crier, deck, sinker and
# prow-controller-manager mount. Scoped to configmaps in prow only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-cluster-connection-kubeconfig
  namespace: prow
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-cluster-connection-kubeconfig
  namespace: prow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-cluster-connection-kubeconfig
subjects:
- kind: ServiceAccount
  name: build-cluster-connection
  namespace: flux-system
---
# Register the build cluster as an Argo CD spoke by writing a labelled cluster Secret in
# the argocd namespace. Scoped to secrets in argocd only.
#
# This has to happen at runtime rather than in Terraform. The build cluster is an ACK
# Cluster CR, so Terraform owning a registration keyed to it recreates the coupling D13
# had to unpick: on a fresh bootstrap Terraform would register a destination before the
# cluster existed, and on destroy it would remove the registration while Applications
# still referenced it. The Job already reads that CR, so it is the natural place.
#
# Argo CD can only apply this Role because flux/argocd/namespaced-rbac.yaml grants the
# capability the same permission in this namespace. argocd is the one namespace the
# associated access policies leave uncovered - AmazonEKSAdminPolicy excludes it, and
# AmazonEKSArgoCDPolicy is the capability's own-operation grant. Without that grantor rule
# escalation prevention refuses this object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-cluster-connection-registrar
  namespace: argocd
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-cluster-connection-registrar
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-cluster-connection-registrar
subjects:
- kind: ServiceAccount
  name: build-cluster-connection
  namespace: flux-system
