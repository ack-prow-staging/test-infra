apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: prometheus
  install:
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  values:
    kube-state-metrics:
      metricLabelsAllowlist: pods=[app,prow.k8s.io/id,prow.k8s.io/refs.repo,prow.k8s.io/type,prow.k8s.io/job,prow.k8s.io/refs.org]
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    grafana:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
    prometheusOperator:
      tls:
        enabled: true
        # Use port 10443 instead of default 10250 to avoid conflict with
        # kubelet port on EKS Auto Mode nodes
        internalPort: 10443
    prometheus:
      prometheusSpec:
        additionalScrapeConfigs:
        - job_name: prow_tide
          static_configs:
          - targets: ["tide.prow.svc.cluster.local:9090"]
        - job_name: prow_plank
          static_configs:
          - targets: ["prow-controller-manager.prow.svc.cluster.local:9090"]
        - job_name: prow_hook
          static_configs:
          - targets: ["hook-metrics.prow.svc.cluster.local:9090"]
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 84.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus