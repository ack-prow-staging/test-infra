# Renders flux/ack/charts/ack-flux instead of the token-substituted manifest.
#
# The HelmRelease sits inside the existing ack-flux Kustomization rather than
# replacing it: HelmRelease.spec.dependsOn can only reference other
# HelmReleases, and ack-flux dependsOn ack-capability, which is a Kustomization.
# Keeping the Kustomization as the ordering primitive preserves the dependency
# graph unchanged.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-flux
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the
  # objects are managed solely by Argo CD, while the enclosing Kustomization stays
  # active and keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently
  # reverted on the next reconcile and both reconcilers end up managing the same
  # objects. Suspending the Kustomization instead does not work either: the
  # HelmRelease is applied BY that Kustomization, so a suspended one can never
  # deliver a suspend to its own HelmRelease.
  #
  # The HelmRelease is left declared rather than deleted so the cutover is reversible
  # by flipping this one field. Deleting it would uninstall the Helm release, which
  # only helm.sh/resource-policy: keep would stop from deleting live AWS resources.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-flux
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: without it the lookup defaults to the HelmRelease's own
        # namespace, which breaks if this object is ever relocated.
        namespace: flux-system
      interval: 60m
  install:
    # The namespace is owned by ack-pod-identities, never by a chart.
    createNamespace: false
  upgrade:
    # Never force-replace. force does a delete+recreate, which for an ACK
    # resource means destroying the AWS resource behind it.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: GHCR_PTC_SECRET_ARN
    targetPath: ghcrPtcSecretArn
