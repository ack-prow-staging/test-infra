# Private ECR repositories for mirrored Prow images.
# Populated by the prow-mirror Job which copies images from upstream registries.
# force-delete: "true" ensures ACK can delete repos even when they contain images.
#
# adoption-policy: adopt-or-create lets a recreated CR adopt the existing
# repository instead of failing with "already exists". Note the deliberate
# asymmetry: there is no deletion-policy: retain here, because force-delete is
# meant to let teardown remove non-empty repos. That means deleting one of these
# CRs destroys the repository AND every image in it, so these CRs must never be
# pruned during a migration - keep the owning Kustomization prune: false while
# its inventory changes shape.
---
apiVersion: ecr.services.k8s.aws/v1alpha1
kind: Repository
metadata:
  name: prow-crier
  annotations:
    ecr.services.k8s.aws/force-delete: "true"
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: prow/crier
  imageTagMutability: MUTABLE
  imageScanningConfiguration:
    scanOnPush: false
---
