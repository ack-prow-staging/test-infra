# Renders flux/ack/charts/ack-capability-role instead of the token-substituted manifest.
#
# This is the root of the ack dependency graph: ack-capability and
# ack-build-infra both dependsOn it. The Role CR already carries stale Helm
# metadata from an earlier attempt naming release ack-system-ack-capability-role;
# helm-controller names releases <targetNamespace>-<name>, which matches exactly,
# so this release adopts the existing object rather than failing on ownership.
#
# force: false below is load bearing - a replace would delete the IAM role the
# ACK capability assumes, which would stop every ACK controller on the cluster.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-capability-role
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the
  # objects are managed solely by Argo CD, while the enclosing Kustomization stays
  # active and keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently
  # reverted on the next reconcile and both reconcilers end up managing the same
  # objects. Suspending the Kustomization instead does not work either: the
  # HelmRelease is applied BY that Kustomization, so a suspended one can never
  # deliver a suspend to its own HelmRelease.
  #
  # This is the IAM role the ACK capability assumes, so it is cut over second-to-last:
  # every other ACK CR depends on the controller this role backs. Verified before
  # suspending that the chart renders all six inline policies with content identical to
  # live - EC2Management, ECRManagement, EKSSelfManagement, IAMManagement,
  # Route53Management, S3ProwLogs - because a chart missing one would have had Argo CD
  # strip a permission the controller needs and stop all 63 CRs reconciling. The
  # apparent difference in a plain spec diff was JSON key ordering.
  #
  # BootstrapPermissions is a seventh policy on the AWS role, owned by Terraform and
  # absent from this CR. ACK leaves it alone, and Argo CD never sees it.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-capability-role
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: otherwise the lookup defaults to the HelmRelease's own namespace.
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: REGION
    targetPath: region
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
