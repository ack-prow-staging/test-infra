# Renders flux/ack/charts/ack-capability instead of the token-substituted manifest.
#
# Six Kustomizations dependsOn ack-capability, so this is the widest-reaching
# conversion in the migration. The Capability CR is what provides the ACK
# controllers themselves, so force: false and the retain policies in the template
# are what keep a failed upgrade from stranding every ACK resource.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-capability
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the
  # objects are managed solely by Argo CD, while the enclosing Kustomization stays
  # active and keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently
  # reverted on the next reconcile and both reconcilers end up managing the same
  # objects. Suspending the Kustomization instead does not work either: the
  # HelmRelease is applied BY that Kustomization, so a suspended one can never
  # deliver a suspend to its own HelmRelease.
  #
  # Cut over LAST, deliberately. This CR is the ACK capability itself - the controller
  # that reconciles all 63 ACK CRs on the stack, including every object every other
  # Application manages. If a sync were to disturb it, nothing else would reconcile,
  # including whatever would be needed to put it back.
  #
  # What made it safe to attempt: the rendered spec and live spec are byte-identical, so
  # server-side apply has only field ownership to transfer and nothing to change. Unlike
  # ack-capability-role there is no serialized-JSON field here, so generation is expected
  # to stay at 1 rather than being rewritten.
  #
  # The capability is also declared in Terraform as awscc_eks_capability.ack, with
  # ignore_changes = all. This CR carries adoption-policy: adopt-or-create, so ACK
  # adopted what Terraform created rather than making a second one.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-capability
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: otherwise the lookup defaults to the HelmRelease's own namespace.
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
