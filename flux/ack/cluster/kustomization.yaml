apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cluster.yaml is deliberately absent: the hub EKS cluster is managed by
# Terraform (bootstrap/cluster.tf, aws_eks_cluster.this), not by ACK. Declaring
# it here as well meant two systems reconciled the same control plane.
resources:
- access-entries.yaml
- nodepool.yaml
- nodepool-control-plane.yaml
- storage-class.yaml
- ingress-class.yaml
