# Renders flux/ack/charts/ack-pod-identities instead of the token-substituted
# manifest. The HelmRelease stays inside the existing Kustomization so the
# dependsOn edges on ack-cluster and ack-pod-identity-roles (Kustomizations) are
# preserved: HelmRelease.spec.dependsOn can only reference other HelmReleases.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-pod-identities
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the
  # objects are managed solely by Argo CD, while the enclosing Kustomization stays
  # active and keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently
  # reverted on the next reconcile and both reconcilers end up managing the same
  # objects. Suspending the Kustomization instead does not work either: the
  # HelmRelease is applied BY that Kustomization, so a suspended one can never
  # deliver a suspend to its own HelmRelease.
  #
  # The Application ignores spec.disableSessionTags, which ACK late-initialises to
  # false and the chart never sets. Without that exception this path could not reach
  # Synced.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-pod-identities
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: otherwise the lookup defaults to the HelmRelease's own namespace.
        namespace: flux-system
      interval: 60m
  install:
    # The prow and test-pods namespaces are applied as raw manifests alongside
    # this HelmRelease, never by a chart.
    createNamespace: false
  upgrade:
    # force would delete and recreate the Pod Identity associations.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
