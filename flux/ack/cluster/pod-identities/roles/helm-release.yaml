# Renders flux/ack/charts/ack-pod-identity-roles instead of the token-substituted manifests.
# The HelmRelease stays inside the existing Kustomization so the dependsOn
# edge(s) on ack-capability (Kustomizations) are preserved:
# HelmRelease.spec.dependsOn can only reference other HelmReleases.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-pod-identity-roles
  namespace: flux-system
spec:
  # SUSPENDED: this path is cut over to Argo CD (Application of the same name, in
  # bootstrap/argocd-applications.tf). helm-controller stops reconciling, so the
  # objects are managed solely by Argo CD, while the enclosing Kustomization stays
  # active and keeps enforcing this field.
  #
  # It has to be declared here rather than applied with kubectl. The root test-infra
  # Kustomization re-applies these specs, so an imperative suspend is silently
  # reverted on the next reconcile and both reconcilers end up managing the same
  # objects. Suspending the Kustomization instead does not work either: the
  # HelmRelease is applied BY that Kustomization, so a suspended one can never
  # deliver a suspend to its own HelmRelease.
  #
  # The HelmRelease is left declared rather than deleted so the cutover is reversible
  # by flipping this one field. Deleting it would uninstall the Helm release, which
  # only helm.sh/resource-policy: keep would stop from deleting live AWS resources.
  suspend: true
  interval: 60m
  targetNamespace: ack-system
  chart:
    spec:
      chart: ./flux/ack/charts/ack-pod-identity-roles
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: test-infra
        # Pinned: otherwise the lookup defaults to the HelmRelease's own namespace.
        namespace: flux-system
      interval: 60m
  install:
    createNamespace: false
  upgrade:
    # force would delete and recreate the AWS resources behind these CRs.
    force: false
  valuesFrom:
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: ACCOUNT_ID
    targetPath: accountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: PUBLISH_ACCOUNT_ID
    targetPath: publishAccountId
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: REGION
    targetPath: region
  - kind: ConfigMap
    name: self-managed-vars
    valuesKey: STACK_NAME
    targetPath: stackName
