# Build cluster Pod Identity Associations, reconciled by the control-plane ACK
# EKS controller. They bind a build-cluster service account to an IAM role via
# standard Pod Identity (pods.eks.amazonaws.com). The roles already exist in this
# account (flux/ack/cluster/pod-identities/roles/prow-iam-roles.yaml), so we reuse
# them by ARN — no new roles/ tree here.
#
# Only pre-submit-service-account is bound: the build cluster runs pre-submit jobs
# exclusively (post-submit/periodic/mirror stay on the control-plane `default`
# cluster), keeping the identity surface minimal for the untrusted PR code here.
# Its cross-account test-role assume is authorized at the account level, not by
# anything on the build-cluster side.
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: prow-build-presubmit-pod-identity
  namespace: ack-system
  annotations:
    # Without this, a recreated CR fails with "ResourceInUseException: Association
    # already exists" and never reaches Ready, which blocks ack-build-infra's health
    # check and every Kustomization behind it. The find identifiers (clusterRef,
    # namespace, serviceAccount) are all in spec, so adoption-fields is not needed.
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  clusterRef:
    from:
      name: build-cluster
  namespace: test-pods
  serviceAccount: pre-submit-service-account
  roleARN: arn:aws:iam::${ACCOUNT_ID}:role/${STACK_NAME}-prow-presubmit-role
