# Flux build-cluster IAM role (Stage 4 — Part D).
#
# Consumed by the CONTROL-PLANE Flux (kustomize-controller) so it can reach the
# build cluster's Kubernetes API server and remote-apply the in-cluster objects
# (test-pods namespace, pre-submit-service-account, prow-build-cluster RBAC) that
# ACK cannot create. Flux authenticates with workload identity (Pod Identity),
# resolving this role via flux-pod-identity.yaml; a matching AccessEntry on the
# build cluster (access-entries.yaml, flux-build-cluster-access) grants the
# cluster-side RBAC.
#
# Least-privilege: the only AWS permission Flux needs to reach a remote EKS
# cluster is eks:DescribeCluster (to fetch the endpoint + CA), scoped to the one
# build cluster. All cluster-side authorization comes from the AccessEntry.
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: flux-build-cluster-role
  namespace: ack-system
spec:
  name: ${STACK_NAME}-flux-build-cluster-role
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }
      ]
    }
  inlinePolicies:
    DescribeBuildCluster: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": ["eks:DescribeCluster"],
            "Resource": "arn:aws:eks:${REGION}:${ACCOUNT_ID}:cluster/${STACK_NAME}-build-cluster"
          }
        ]
      }
