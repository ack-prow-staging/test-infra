# Build-cluster ACK resources (all-ACK, same account as the control plane).
#
# A single Flux Kustomization reconciles the whole build-cluster tree. Unlike
# the control-plane cluster (Terraform shell + ACK day-2), the build cluster is
# provisioned end-to-end by the EC2/EKS/IAM controllers from these CRs — no
# Terraform. Internal ordering needs no Flux dependsOn: the day-2 CRs clusterRef
# the create-path Cluster CR, so ACK waits for status ACTIVE on its own.
#
# dependsOn ack-capability + ack-capability-role so the capability role's
# widened EC2/EKS scope lands before ACK attempts any creates.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ack-build-infra
  namespace: flux-system
spec:
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: test-infra
  path: ./flux/ack/build-cluster
  prune: true
  deletionPolicy: WaitForTermination
  targetNamespace: ack-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: self-managed-vars
  dependsOn:
  - name: ack-capability
  - name: ack-capability-role
  # wait: true health-checked all 23 objects in this path - the VPC, subnets, route
  # tables, NAT gateway, IAM roles, access entries and the cluster itself. Gating the
  # whole tree on all of them is fragile: every object must report Ready on the same
  # reconcile, and a single one that never settles blocks the five Kustomizations
  # downstream, which is what kept Prow down in staging. All 23 were individually
  # Ready with matching observedGeneration, yet the aggregate check never completed
  # because the path re-applies as "configured" each cycle.
  #
  # Gate instead on what dependents genuinely need: the build cluster existing, and
  # the access entries that let Prow and Flux reach it. The rest of the path is still
  # applied and reconciled, it just no longer decides whether the tree may proceed.
  wait: false
  healthChecks:
  - apiVersion: eks.services.k8s.aws/v1alpha1
    kind: Cluster
    name: build-cluster
    namespace: ack-system
  - apiVersion: eks.services.k8s.aws/v1alpha1
    kind: AccessEntry
    name: flux-build-cluster-access
    namespace: ack-system
  - apiVersion: eks.services.k8s.aws/v1alpha1
    kind: AccessEntry
    name: prow-deployment-build-access
    namespace: ack-system
  timeout: 30m
